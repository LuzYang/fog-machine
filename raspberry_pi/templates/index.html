<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LASSI Entrance Lights</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 680px; margin: 0 auto; padding: 24px; background: #0b0b0d; color: #f6f6f6; }
    .panel { padding: 20px; border: 1px solid #333; border-radius: 14px; background: #151518; }
    .effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button, select, input { min-height: 42px; }
    button { border: 0; border-radius: 8px; background: #34343b; color: white; cursor: pointer; }
    button.active { outline: 2px solid #ff3b30; background: #5b1d1a; }
    button.blackout { grid-column: 1 / -1; background: #a31616; font-weight: 700; }
    label { display: grid; grid-template-columns: 130px 1fr 55px; align-items: center; gap: 10px; margin-top: 18px; }
    input[type="color"] { width: 100%; }
    #status { min-height: 24px; color: #aaa; }
    @media (max-width: 480px) { .effects { grid-template-columns: 1fr 1fr; } label { grid-template-columns: 100px 1fr 45px; } }
  </style>
</head>
<body>
  <h1>LASSI 灯带控制</h1>
  <div class="panel">
    <div class="effects">
      <button data-effect="solid">常亮 Solid</button>
      <button data-effect="pulse">脉冲 Pulse</button>
      <button data-effect="flash">闪烁 Flash</button>
      <button data-effect="chase">流水 Chase</button>
      <button class="blackout" data-effect="blackout">立即关灯 BLACKOUT</button>
    </div>

    <label>颜色 Color <input id="color" type="color" value="#ff0000"><span></span></label>
    <label>亮度 Brightness <input id="brightness" type="range" min="0" max="255" value="80"><output>80</output></label>
    <label>周期 Speed <input id="speed" type="range" min="100" max="2000" step="50" value="500"><output>500</output></label>
    <label>流水长度 Width <input id="width" type="range" min="1" max="15" value="4"><output>4</output></label>
    <label>方向 Direction
      <select id="direction"><option value="forward">向前 Forward</option><option value="reverse">反向 Reverse</option></select>
      <span></span>
    </label>
    <p id="status">请选择一种效果。</p>
  </div>

  <script>
    let currentEffect = "blackout";
    let sendTimer;
    const status = document.querySelector("#status");

    function colorChannels() {
      const value = document.querySelector("#color").value;
      return {
        r: parseInt(value.slice(1, 3), 16),
        g: parseInt(value.slice(3, 5), 16),
        b: parseInt(value.slice(5, 7), 16)
      };
    }

    async function sendState(effect = currentEffect) {
      currentEffect = effect;
      const payload = {
        effect,
        ...colorChannels(),
        brightness: Number(document.querySelector("#brightness").value),
        speed_ms: Number(document.querySelector("#speed").value),
        width: Number(document.querySelector("#width").value),
        direction: document.querySelector("#direction").value
      };

      status.textContent = "正在发送…";
      try {
        const response = await fetch("/api/led", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "request failed");
        status.textContent = `已启用 ${result.effect}`;
        document.querySelectorAll("[data-effect]").forEach(button => {
          button.classList.toggle("active", button.dataset.effect === result.effect);
        });
      } catch (error) {
        status.textContent = `错误：${error.message}`;
      }
    }

    function scheduleUpdate() {
      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => sendState(), 120);
    }

    document.querySelectorAll("[data-effect]").forEach(button => {
      button.addEventListener("click", () => sendState(button.dataset.effect));
    });

    document.querySelectorAll("input, select").forEach(control => {
      control.addEventListener("input", () => {
        const output = control.parentElement.querySelector("output");
        if (output) output.value = control.value;
        if (currentEffect !== "blackout") scheduleUpdate();
      });
    });
  </script>
</body>
</html>
